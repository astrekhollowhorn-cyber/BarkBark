<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bark Bark! - Alpha Beta Test</title>
    <style>
        :root {
            --bg-color: #fdf8f5;
            --card-bg: #ffffff;
            --primary-pink: #f4a261;
            --soft-pink: #fbd1a2;
            --accent-pink: #e76f51;
            --pastel-green: #a8e6cf;
            --dark-green: #2a9d8f;
            --warm-brown: #6b4226;
            --text-dark: #4a3b32;
            --text-light: #7f6a5d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: 'Segoe UI', Quicksand, 'Comic Sans MS', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .card {
            background-color: var(--card-bg);
            max-width: 650px;
            width: 100%;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 12px 32px rgba(107, 66, 38, 0.08);
            border: 3px solid var(--soft-pink);
            animation: floatIn 0.8s ease-out;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .badge {
            display: inline-block;
            background-color: var(--pastel-green);
            color: #1b5e55;
            font-weight: bold;
            font-size: 0.85em;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 12px;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        h1 {
            color: var(--warm-brown);
            font-size: 2.4em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 1.05em;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .warning-box {
            background-color: #fff5f2;
            border: 2px dashed var(--accent-pink);
            border-radius: 16px;
            padding: 18px;
            text-align: left;
            margin-bottom: 25px;
            font-size: 0.92em;
            color: #8c3b27;
        }

        .warning-box strong {
            display: block;
            margin-bottom: 6px;
            color: var(--accent-pink);
        }

        .btn-download {
            display: inline-block;
            background-color: var(--accent-pink);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 36px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 6px 18px rgba(231, 111, 81, 0.35);
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .btn-download:hover {
            background-color: #d95d3f;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 22px rgba(231, 111, 81, 0.45);
        }

        .updates-section {
            background-color: #f4faf7;
            border: 2px solid var(--pastel-green);
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            margin-bottom: 25px;
        }

        .updates-title {
            font-weight: bold;
            color: var(--dark-green);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .updates-list {
            list-style: none;
            font-size: 0.9em;
            color: var(--text-dark);
        }

        .updates-list li {
            position: relative;
            padding-left: 18px;
            margin-bottom: 8px;
            line-height: 1.4;
        }
